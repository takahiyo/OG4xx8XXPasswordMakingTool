name = "og4xx-password-tool"
# ★変更点: src/index.js ではなく index.js を指定
main = "index.js"
compatibility_date = "2024-01-01"

# [共通変数]
[vars]
ALLOW_ORIGIN = "*"
# ★重要: ここでキーを設定しているため、コード内には書かなくてOKです
FIXED_KEY = "VoIPGateway48231"
ADMIN_PATH = "/admin"
ADMIN_TOKEN_QUERY_KEY = "token"

# [本番環境設定]
[env.production]
name = "og4xx-password-tool"
[env.production.vars]
ENVIRONMENT = "production"

# ▼あなたのD1データベースID (変更なし)▼
[[d1_databases]]
binding = "DB"
database_name = "og4xx8xxpassword_db"
database_id = "2e8b1bdc-2dcb-48ab-afd9-2719435dce07"

# [開発環境設定]
[env.dev]
name = "og4xx-password-tool-dev"
[env.dev.vars]
ENVIRONMENT = "development"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "og4xx8xxpassword_db"
database_id = "2e8b1bdc-2dcb-48ab-afd9-2719435dce07"
